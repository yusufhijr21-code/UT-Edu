<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ular Tangga Edukasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ===== LAYAR SETUP ===== -->
  <section id="setup-screen" class="screen">
    <div class="setup-card">
      <h1 id="game-title">Ular Tangga Edukasi</h1>
      <p class="tagline">Jawab soal dengan benar untuk melaju di papan!</p>

      <div class="field">
        <label for="player-count">Jumlah pemain</label>
        <select id="player-count"></select>
      </div>

      <div id="player-name-fields"></div>

      <button id="start-game-btn" class="btn btn-primary">Mulai Bermain</button>
      <a href="admin.html" class="admin-link">Panel Admin →</a>
    </div>
  </section>

  <!-- ===== LAYAR PERMAINAN ===== -->
  <section id="game-screen" class="screen hidden">
    <header class="game-header">
      <h1 id="game-title-2">Ular Tangga Edukasi</h1>
      <button id="restart-btn" class="btn btn-ghost">Main Ulang</button>
    </header>

    <div class="game-layout">
      <div class="board-wrapper">
        <div id="board" class="board"></div>
      </div>

      <aside class="sidebar">
        <div class="turn-card">
          <div class="turn-label">Giliran</div>
          <div id="current-player-name" class="turn-name">-</div>
        </div>

        <div class="dice-area">
          <div id="dice" class="dice">🎲</div>
          <button id="roll-btn" class="btn btn-primary">Kocok Dadu</button>
        </div>

        <div id="turn-message" class="turn-message"></div>

        <div class="players-list" id="players-list"></div>
      </aside>
    </div>
  </section>

  <!-- ===== MODAL SOAL ===== -->
  <div id="question-modal" class="modal-overlay hidden">
    <div class="modal question-modal">
      <div class="question-badge">📘 Jawab dulu untuk lanjut!</div>
      <p id="question-text" class="question-text"></p>
      <div id="question-options" class="question-options"></div>
      <div id="question-feedback" class="question-feedback hidden"></div>
    </div>
  </div>

  <!-- ===== MODAL MENANG ===== -->
  <div id="winner-modal" class="modal-overlay hidden">
    <div class="modal winner-modal">
      <div class="winner-emoji">🏆</div>
      <h2 id="winner-text">Selamat!</h2>
      <button id="play-again-btn" class="btn btn-primary">Main Lagi</button>
    </div>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/game.js"></script>
</body>
</html>
